[package]
name = "quire-exact"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "The exact-value kernel: checked identity, typestate, outcome and refusal, provenance, and bound value types, with no dependency on any other crate in the quire ecosystem."
authors = ["Agent IX <peter@agent-ix.ai>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/agent-ix/quire-exact"
publish = false

[lib]
name = "quire_exact"
path = "src/lib.rs"

[features]
# The ordered charge log (`Meter::admitted_charges`). A production
# meter keeps a count only; tests that assert exact charge sequences enable
# this through a dev-dependency, which resolver 2 turns on only for test
# builds. A normal or build dependency must never enable it.
test-support = []

[dependencies]
# Inline comparison frames are initialized only as the cursor visits them.
arrayvec = { version = "0.7.6", default-features = false }
allocator-api2 = { version = "0.2.21", default-features = false, features = ["alloc"] }
num-bigint = { version = "0.4.8", default-features = false }
num-integer = { version = "0.1.47", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
# `race` supplies a no_std, alloc-compatible Sync cell for retained BigInt views.
once_cell = { version = "=1.21.4", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.20", default-features = false }
triomphe = { version = "0.1.17", default-features = false }
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex"] }
# The Unicode 17 text definition requires 0.1.25's tables; 0.1.26 uses Unicode 18.
unicode-normalization = { version = "=0.1.25", default-features = false }

[dev-dependencies]
allocation-counter = "0.8.1"
forge-alloc = { version = "0.3.7", default-features = false }
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", branch = "main" }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = "deny"
